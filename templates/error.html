<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>

    <style>
        body {
            border: 3px solid #000;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-image: linear-gradient(135deg, #6f92b5, #887fae);
        }

        img {
            width: 350px;
            max-width: 90%;
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #0d6efd;
        }

        button a {
            color: white;
            text-decoration: none;
        }

        button:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>

<body>

    <h1>404 - Page Not Found</h1>

    <img src="assets/pagenotfound.png" alt="Page Not Found">

    <h3>Sorry, the page you are looking for does not exist.</h3>

    <button>
        <a href="/">Home</a>
    </button>

</body>
</html>
