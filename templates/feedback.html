<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .card{
            background:white;
            width:420px;
            padding:35px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,0.25);
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            color:#222;
        }

        p{
            text-align:center;
            color:gray;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
        }

        input,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:10px;
            margin-bottom:18px;
            font-size:15px;
            outline:none;
            transition:0.3s;
        }

        input:focus,
        textarea:focus{
            border-color:#2196F3;
            box-shadow:0 0 8px rgba(33,150,243,.3);
        }

        textarea{
            resize:none;
        }

        button{
            width:100%;
            padding:14px;
            background:#2196F3;
            color:white;
            border:none;
            border-radius:10px;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1976D2;
        }
    </style>

</head>

<body>

<div class="card">

<h1>💬 Feedback</h1>

<p>We'd love to hear your thoughts.</p>

<form method="POST">

<label>👤 Name</label>
<input type="text"
       name="Name"
       placeholder="Enter your full name"
       required>

<label>📧 Email</label>
<input type="email"
       name="Email"
       placeholder="example@gmail.com"
       required>

<label>💬 Feedback</label>

<textarea
name="message"
rows="6"
placeholder="Share your feedback..."
required></textarea>

<button type="submit">Submit Feedback</button>

</form>

</div>

</body>
</html>
